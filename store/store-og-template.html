<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demo Store — social preview template</title>
    <!--
      Template for the storefront social preview card.
      NOT a served file: this lives outside ./public, so it is not published.
      Render to a 1200x630 JPEG at deploy time or when the copy changes:
        chrome --headless=new --force-device-scale-factor=1 --window-size=1200,630 \
               --screenshot=public/og-image-store.png store-og-template.html
      then convert the PNG to JPEG and update og:image if the filename changes.
      Declared og:image:width/height must stay 1200x630.
    -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            /* Same palette as the storefront, which reuses the consulting design system. */
            background-color: #d9f2fb;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .og-box {
            width: min(1200px, 100vw);
            aspect-ratio: 1200 / 630;
            height: auto;
            background: linear-gradient(180deg, #d9f2fb 0%, #fffafb 68%, #f5a9b8 68%, #f5a9b8 100%);
            border: 4px solid #1d2d2a;
            border-radius: 28px;
            box-sizing: border-box;
            display: flex;
            flex-shrink: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: clamp(20px, 3.33vw, 40px);
            color: #1d2d2a;
        }

        .og-title {
            background-color: #fffafb;
            border: 2px solid #1d2d2a;
            padding: 20px 28px;
            border-radius: 18px;
            margin-bottom: 20px;
            font-size: clamp(26px, 4vw, 48px);
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .og-subtitle {
            background-color: #fffafb;
            border: 2px solid #e58fa2;
            padding: 16px 36px;
            border-radius: 18px;
            font-size: clamp(16px, 2.33vw, 28px);
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .og-description {
            background-color: #fffafb;
            border: 2px solid #5bc8e8;
            padding: 18px 32px;
            border-radius: 18px;
            font-size: clamp(14px, 1.92vw, 23px);
            line-height: 1.7;
            max-width: 820px;
            margin: 0 auto 32px auto;
        }

        .og-url {
            background-color: #f5a9b8;
            border: 2px solid #1d2d2a;
            padding: 16px 36px;
            border-radius: 18px;
            font-size: clamp(16px, 2.33vw, 28px);
            font-weight: 600;
            color: #051d00;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="og-box">
        <div class="og-title">Demo Store</div>
        <div class="og-subtitle">Physical, digital, and service products</div>
        <div class="og-description">
            A working demonstration storefront.<br>
            Nothing is charged and no goods ship.
        </div>
        <div class="og-url">store.victoriawinter00.com</div>
    </div>

</body>
</html>
